<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我是人博客</title>
<style>
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
            background: #f9f8f6;
            color: #1e1e1c;
            padding: 20px 24px;
            line-height: 1.6;
            max-width: 1500px;
            margin: 0 auto;
        }

        a {
            text-decoration: none;
            transition: all 0.2s ease;
        }

        p {
            margin-bottom: 12px;
        }

        hr {
            border: 0;
            border-top: 2px solid #e2ddd6;
            margin: 24px 0;
        }

        .text-primary {
            color: #cc785c;
        }

        .underline {
            text-decoration: none;
        }

        .font-bold {
            font-weight: 600;
        }


        /* 保留原有块级元素的背景色、圆角、阴影等 */
        h2.text-xl {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: #1e1e1c;
        }

        img {
            max-width: 100%;
            height: auto;
            vertical-align: middle;
        }

        .nav-btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 6px;
            align-items: center;
        }
        .nav-btn-group a {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 50px;
            background: #bbbbbb;
            color: #777;
            font-size: 16px;
            font-family: "Noto Sans SC", sans-serif;
            transition: all 0.2s;
            text-decoration: none;
        }
        .nav-btn-group a:hover {
            background: #aaa;
            color: #333;
            transform: translateY(-1px);
        }

        /* 保留其他原有色块链接 (棕色/蓝色) */
        a[style*="background: none 0% 0% / auto repeat scroll padding-box border-box rgb(121, 85, 72)"] {
            display: inline-block;
            padding: 2px 14px;
            border-radius: 12px;
            background: #795548 !important;
            color: #fff !important;
            font-size: 24px;
            font-family: "Noto Sans SC", sans-serif;
            transition: all 0.2s;
        }
        a[style*="background: none 0% 0% / auto repeat scroll padding-box border-box rgb(121, 85, 72)"]:hover {
            background: #5d4037 !important;
            transform: scale(1.02);
        }

        a[style*="background: none 0% 0% / auto repeat scroll padding-box border-box rgb(79, 195, 247)"] {
            display: inline-block;
            padding: 2px 14px;
            border-radius: 12px;
            background: #4fc3f7 !important;
            color: #fff !important;
            font-size: 16px;
            font-family: "Noto Sans SC", sans-serif;
            transition: all 0.2s;
        }
        a[style*="background: none 0% 0% / auto repeat scroll padding-box border-box rgb(79, 195, 247)"]:hover {
            background: #29b6f6 !important;
            transform: scale(1.02);
        }

        /* 其他微调：防止文字溢出，改善可读性 */
        .inline-block {
            display: inline-block;
        }

        .max-w-full {
            max-width: 100%;
        }

        .cursor-pointer {
            cursor: pointer;
        }

        .align-bottom {
            vertical-align: bottom;
        }

        [data-hve-hovered] {
            outline: 2px dashed #cc785c !important;
            outline-offset: 2px !important;
            cursor: pointer !important;
        }

        /* 优化移动端显示 */
        @media (max-width: 640px) {
            body {
                padding: 12px 16px;
            }
            a[style*="background: none 0% 0% / auto repeat scroll padding-box border-box rgb(121, 85, 72)"] {
                font-size: 18px !important;
                padding: 2px 10px;
            }
            .max-w-lg {
                max-width: 100%;
            }
            .nav-btn-group a {
                font-size: 14px;
                padding: 3px 12px;
            }
            .search-btn {
                transform: scale(0.6);
                padding: 0.5rem 1rem;
                font-size: 0.85rem;
            }
            .welcome-left {
                font-size: 18px;
                margin-right: 12px;
                white-space: normal;
            }
            .search-wrapper {
                flex-wrap: wrap;
            }
        }

    </style>
</head>
